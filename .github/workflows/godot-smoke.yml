name: Godot smoke checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-smoke:
    name: Godot 4.6.3 headless
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false

      - name: Enforce active inheritance depth budget
        run: python3 tests/check_inheritance_depth.py --max-depth 14

      - name: Import assets and register script classes
        run: bash tests/check_godot_run.sh godot --headless --path . --import

      - name: Run lightweight contract checks
        run: bash tests/check_godot_run.sh godot --headless --path . --script res://tests/smoke.gd

      - name: Test live scene, campaign navigation and hotseat firing
        run: bash tests/check_godot_run.sh godot --headless --path . --script res://tests/runtime_integration.gd

      - name: Test online packet and snapshot contracts
        run: bash tests/check_godot_run.sh godot --headless --path . --script res://tests/network_contracts.gd

      - name: Test realtime AI, projectile launch and camera focus
        run: bash tests/check_godot_run.sh godot --headless --path . --script res://tests/realtime_camera_integration.gd

      - name: Exercise real ENet duel across two headless Godot processes
        shell: bash
        run: |
          timeout 25s godot --headless --path . --script res://tests/online_enet_peer.gd -- --role=host > /tmp/tilt-host.log 2>&1 &
          host_pid=$!
          sleep 1
          timeout 25s godot --headless --path . --script res://tests/online_enet_peer.gd -- --role=guest > /tmp/tilt-guest.log 2>&1 &
          guest_pid=$!
          set +e
          wait "$host_pid"
          host_status=$?
          wait "$guest_pid"
          guest_status=$?
          set -e
          echo "=== Host log ==="
          cat /tmp/tilt-host.log
          echo "=== Guest log ==="
          cat /tmp/tilt-guest.log
          # Godot can print runtime SCRIPT ERROR while still returning exit 0.
          # Treat any engine error on either peer as a failed integration run.
          if grep -Eq 'SCRIPT ERROR:|(^|[[:space:]])ERROR:|FATAL:' /tmp/tilt-host.log /tmp/tilt-guest.log; then
            echo "Godot reported runtime errors during online test"
            exit 1
          fi
          if [ "$host_status" -ne 0 ] || [ "$guest_status" -ne 0 ]; then
            echo "Host exit: $host_status; guest exit: $guest_status"
            exit 1
          fi

      - name: Start the main scene (headless smoke)
        run: bash tests/check_godot_run.sh godot --headless --path . --quit-after 3
